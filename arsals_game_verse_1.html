<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Verse</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-size: 1.05rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: linear-gradient(180deg, #1e293b, #111827);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }

    .game-icon {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .game-card h3 {
      text-align: center;
      margin: 0 0 14px;
      font-size: 1.4rem;
    }

    .mini-game {
      margin-top: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      min-height: 24px;
      text-align: center;
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .guess-row, .rps-row, .quiz-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .guess-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn.secondary {
      background: #2563eb;
    }

    .btn.warn {
      background: #f59e0b;
    }

    .guess-output, .rps-output, .quiz-output {
      margin-top: 10px;
      min-height: 24px;
      color: #dbeafe;
      font-size: 0.95rem;
    }

    .rps-choice, .quiz-option {
      flex: 1 1 45%;
      padding: 10px 8px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      cursor: pointer;
      text-align: center;
    }

    .memory-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .memory-card {
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 1.7rem;
      cursor: pointer;
    }

    .memory-card.flipped {
      background: #2563eb;
    }

    .memory-card.matched {
      background: #22c55e;
      cursor: default;
    }

    .reaction-box {
      width: 100%;
      height: 110px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
      user-select: none;
    }

    .reaction-box.waiting {
      background: #7c2d12;
      color: #fef3c7;
    }

    .reaction-box.ready {
      background: #166534;
      color: #dcfce7;
    }

    .reaction-box.tooSoon {
      background: #991b1b;
      color: #fee2e2;
    }

    .quiz-question {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    @media (max-width: 600px) {
      .game-grid { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Game Verse</h1>
    <div class="subtitle">6 Playable Mini Games</div>

    <div class="game-grid">
      <div class="game-card">
        <div class="game-icon">❌</div>
        <h3>Tic-Tac-Toe</h3>
        <div class="mini-game">
          <div class="board" id="tttBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
          </div>
          <div class="status" id="tttStatus">Your turn: X</div>
          <button class="btn" id="tttReset">Reset</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">🎯</div>
        <h3>Number Guess</h3>
        <div class="mini-game">
          <div class="guess-row">
            <input id="guessInput" type="number" min="1" max="100" placeholder="1-100">
            <button class="btn" id="guessBtn">Guess</button>
          </div>
          <div class="guess-output" id="guessOutput">I picked a number between 1 and 100.</div>
          <button class="btn secondary" id="guessReset" style="margin-top:10px;">New Game</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">✊</div>
        <h3>Rock Paper Scissors</h3>
        <div class="mini-game">
          <div class="rps-row">
            <button class="rps-choice" data-choice="Rock">Rock</button>
            <button class="rps-choice" data-choice="Paper">Paper</button>
            <button class="rps-choice" data-choice="Scissors">Scissors</button>
          </div>
          <div class="rps-output" id="rpsOutput">Choose your move!</div>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">🧠</div>
        <h3>Memory Match</h3>
        <div class="mini-game">
          <div class="memory-board" id="memoryBoard"></div>
          <div class="status" id="memoryStatus">Match all pairs!</div>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">⚡</div>
        <h3>Reaction Test</h3>
        <div class="mini-game">
          <div class="reaction-box" id="reactionBox">Click to start</div>
          <div class="status" id="reactionStatus">Wait for green...</div>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">❓</div>
        <h3>Quick Quiz</h3>
        <div class="mini-game">
          <div class="quiz-question" id="quizQuestion"></div>
          <div class="quiz-row" id="quizOptions"></div>
          <div class="quiz-output" id="quizOutput">Score: 0 / 0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tttCells = [...document.querySelectorAll('.cell')];
    const tttStatus = document.getElementById('tttStatus');
    let tttBoard = Array(9).fill('');
    let tttGameOver = false;

    function resetTicTacToe() {
      tttBoard = Array(9).fill('');
      tttGameOver = false;
      tttCells.forEach(cell => {
        cell.textContent = '';
        cell.disabled = false;
      });
      tttStatus.textContent = 'Your turn: X';
    }

    function checkWinner(board) {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [a,b,c] of lines) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return null;
    }

    function makeComputerMove() {
      if (tttGameOver) return;
      const available = tttBoard
        .map((v, idx) => v === '' ? idx : null)
        .filter(v => v !== null);

      if (!available.length) {
        tttGameOver = true;
        tttStatus.textContent = "It's a draw!";
        return;
      }

      const randomIndex = available[Math.floor(Math.random() * available.length)];
      tttBoard[randomIndex] = 'O';
      tttCells[randomIndex].textContent = 'O';
      tttCells[randomIndex].disabled = true;

      const winner = checkWinner(tttBoard);
      if (winner) {
        tttGameOver = true;
        tttStatus.textContent = winner === 'X' ? 'You win!' : 'Computer wins!';
        return;
      }

      if (tttBoard.every(v => v !== '')) {
        tttGameOver = true;
        tttStatus.textContent = "It's a draw!";
        return;
      }

      tttStatus.textContent = 'Your turn: X';
    }

    tttCells.forEach(cell => {
      cell.addEventListener('click', () => {
        if (tttGameOver || cell.textContent) return;

        const idx = Number(cell.dataset.index);
        tttBoard[idx] = 'X';
        cell.textContent = 'X';
        cell.disabled = true;

        const winner = checkWinner(tttBoard);
        if (winner) {
          tttGameOver = true;
          tttStatus.textContent = 'You win!';
          return;
        }

        if (tttBoard.every(v => v !== '')) {
          tttGameOver = true;
          tttStatus.textContent = "It's a draw!";
          return;
        }

        tttStatus.textContent = 'Computer thinking...';
        setTimeout(makeComputerMove, 350);
      });
    });

    document.getElementById('tttReset').addEventListener('click', resetTicTacToe);
    resetTicTacToe();

    let targetNumber = Math.floor(Math.random() * 100) + 1;
    const guessInput = document.getElementById('guessInput');
    const guessOutput = document.getElementById('guessOutput');
    const guessBtn = document.getElementById('guessBtn');
    const guessReset = document.getElementById('guessReset');

    function resetGuessGame() {
      targetNumber = Math.floor(Math.random() * 100) + 1;
      guessInput.value = '';
      guessOutput.textContent = 'I picked a number between 1 and 100.';
    }

    guessBtn.addEventListener('click', () => {
      const value = Number(guessInput.value);

      if (!value || value < 1 || value > 100) {
        guessOutput.textContent = 'Enter a valid number from 1 to 100.';
        return;
      }

      if (value < targetNumber) {
        guessOutput.textContent = 'Too low! Try a higher number.';
      } else if (value > targetNumber) {
        guessOutput.textContent = 'Too high! Try a lower number.';
      } else {
        guessOutput.textContent = `Correct! ${targetNumber} was the number!`;
      }
    });

    guessReset.addEventListener('click', resetGuessGame);

    const rpsChoices = document.querySelectorAll('.rps-choice');
    const rpsOutput = document.getElementById('rpsOutput');
    const choices = ['Rock', 'Paper', 'Scissors'];

    rpsChoices.forEach(button => {
      button.addEventListener('click', () => {
        const player = button.dataset.choice;
        const computer = choices[Math.floor(Math.random() * choices.length)];

        if (player === computer) {
          rpsOutput.textContent = `You both picked ${player}. It's a tie!`;
        } else if (
          (player === 'Rock' && computer === 'Scissors') ||
          (player === 'Paper' && computer === 'Rock') ||
          (player === 'Scissors' && computer === 'Paper')
        ) {
          rpsOutput.textContent = `You win! ${player} beats ${computer}.`;
        } else {
          rpsOutput.textContent = `You lose! ${computer} beats ${player}.`;
        }
      });
    });

    const emojis = ['🍉', '🍋', '🍇', '🍒', '🍊', '🍍', '🍎', '🍏'];
    const memoryBoard = document.getElementById('memoryBoard');
    const memoryStatus = document.getElementById('memoryStatus');

    let memoryCards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let lockBoard = false;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildMemoryGame() {
      const pairs = [...emojis, ...emojis];
      const shuffled = shuffle(pairs);

      memoryBoard.innerHTML = '';
      memoryCards = [];

      shuffled.forEach((emoji, index) => {
        const btn = document.createElement('button');
        btn.className = 'memory-card';
        btn.dataset.value = emoji;
        btn.dataset.index = index;
        btn.textContent = '?';
        btn.addEventListener('click', () => handleMemoryClick(btn));
        memoryBoard.appendChild(btn);
        memoryCards.push(btn);
      });

      flippedCards = [];
      matchedPairs = 0;
      lockBoard = false;
      memoryStatus.textContent = 'Match all pairs!';
    }

    function handleMemoryClick(card) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.textContent = card.dataset.value;
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        lockBoard = true;
        const [first, second] = flippedCards;

        if (first.dataset.value === second.dataset.value) {
          first.classList.add('matched');
          second.classList.add('matched');
          matchedPairs++;
          memoryStatus.textContent = 'Nice match!';
          flippedCards = [];
          lockBoard = false;

          if (matchedPairs === emojis.length) {
            memoryStatus.textContent = 'You won! All pairs matched!';
          }
        } else {
          memoryStatus.textContent = 'Not a match. Try again!';
          setTimeout(() => {
            first.textContent = '?';
            second.textContent = '?';
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            flippedCards = [];
            lockBoard = false;
          }, 700);
        }
      }
    }

    buildMemoryGame();

    const reactionBox = document.getElementById('reactionBox');
    const reactionStatus = document.getElementById('reactionStatus');
    let reactionStarted = false;
    let reactionTimer = null;
    let reactionReadyAt = 0;

    function startReactionTest() {
      reactionStarted = true;
      reactionBox.classList.remove('tooSoon');
      reactionBox.classList.add('waiting');
      reactionBox.textContent = 'Wait for green...';

      const delay = 1500 + Math.random() * 2500;
      reactionTimer = setTimeout(() => {
        reactionReadyAt = Date.now();
        reactionBox.classList.remove('waiting');
        reactionBox.classList.add('ready');
        reactionBox.textContent = 'CLICK!';
      }, delay);
    }

    reactionBox.addEventListener('click', () => {
      if (!reactionStarted) {
        startReactionTest();
        reactionStatus.textContent = 'Started...';
        return;
      }

      if (reactionBox.classList.contains('waiting')) {
        clearTimeout(reactionTimer);
        reactionBox.classList.remove('waiting');
        reactionBox.classList.add('tooSoon');
        reactionBox.textContent = 'Too soon!';
        reactionStatus.textContent = 'Click to try again.';
        reactionStarted = false;
        return;
      }

      if (reactionBox.classList.contains('ready')) {
        const reactionTime = Date.now() - reactionReadyAt;
        reactionStatus.textContent = `Your reaction time: ${reactionTime}ms`;
        reactionBox.classList.remove('ready');
        reactionBox.classList.add('waiting');
        reactionBox.textContent = 'Click to start';
        reactionStarted = false;
      }
    });

    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizOutput = document.getElementById('quizOutput');

    const quizData = [
      {
        question: 'Which planet is known as the Red Planet?',
        options: ['Mars', 'Venus', 'Jupiter', 'Mercury'],
        answer: 'Mars'
      },
      {
        question: 'What does HTML stand for?',
        options: ['HyperText Markup Language', 'Home Tool Markup Language', 'Hyperlink Text Management Language', 'HighText Machine Language'],
        answer: 'HyperText Markup Language'
      },
      {
        question: 'Which language runs in web browsers?',
        options: ['Python', 'C++', 'JavaScript', 'Java'],
        answer: 'JavaScript'
      }
    ];

    let quizIndex = 0;
    let quizScore = 0;

    function renderQuiz() {
      if (quizIndex >= quizData.length) {
        quizQuestion.textContent = 'Quiz complete!';
        quizOptions.innerHTML = '';
        quizOutput.textContent = `Final score: ${quizScore} / ${quizData.length}`;
        return;
      }

      const current = quizData[quizIndex];
      quizQuestion.textContent = current.question;
      quizOptions.innerHTML = '';

      current.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = option;
        btn.addEventListener('click', () => {
          if (option === current.answer) {
            quizScore++;
          }
          quizOutput.textContent = `Score: ${quizScore} / ${quizData.length}`;
          quizIndex++;
          setTimeout(renderQuiz, 600);
        });
        quizOptions.appendChild(btn);
      });
    }

    renderQuiz();
  </script>
</body>
</html>
